# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Build and Push Docker Image

# Dispara sempre que fizer push na branch main
on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar o repositório
      - uses: actions/checkout@v4

      # 2️⃣ Configurar Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Build do JAR com Maven
      - name: Build JAR
        run: mvn clean package -DskipTests

      # 4️⃣ Login no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build da imagem Docker
      - name: Build Docker image
        run: docker build -t proofchain/proofchain-api:latest .

      # 6️⃣ Enviar imagem para Docker Hub
      - name: Push Docker image
        run: docker push proofchain/proofchain-api:latest
