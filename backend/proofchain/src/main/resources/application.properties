server.port=${PORT:8080}
spring.application.name=proofchain
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.forward-headers-strategy=framework

logging.level.org.hibernate=INFO
logging.level.org.hibernate.engine.jdbc.connections=WARN
logging.level.org.hibernate.SQL=OFF
spring.jpa.open-in-view=false
#logging.level.org.hibernate=DEBUG

# ==========================================
# Configuraçoes de Seguranca e Token JWT
# ==========================================

# Chave secreta em texto puro para assinatura digital (manimo de 32 caracteres/256 bits)
#security.jwt.secret=6Uvp/nAn/1VLi0E0gflxhYpSEBmPOjxOlalD5fRdO+E=
security.jwt.secret=${JWT_SECRET}

# Tempo de validade do Access Token: 15 minutos (15 * 60 * 1000)
security.jwt.access-token.expiration=900000

# Tempo de validade do Refresh Token: 12 horas (12 * 60 * 60 * 1000)
security.jwt-token.refresh-expiration=43200000