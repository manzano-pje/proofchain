services:
  api:
    build: .
    container_name: proofchain-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/proofchain
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - APP_JWT_SECRET=${JWT_SECRET:-UMA_CHAVE_MUITO_LONGA_E_SEGURA_BASE64}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: proofchain-db
    restart: always
    environment:
      - POSTGRES_DB=proofchain
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d proofchain"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
